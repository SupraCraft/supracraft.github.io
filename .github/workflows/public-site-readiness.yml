name: public-site-readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Validate static public contract and leakage boundary
        run: python3 ./scripts/check-public-site.py

      - name: Install web QA dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser, navigation, responsive, and accessibility matrix
        run: npm run site:test

      - name: Resolve Chromium for Lighthouse
        run: |
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run Lighthouse budgets
        run: npm run site:lighthouse

      - name: Check candidate-local and external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose
            --no-progress
            --root-dir ${{ github.workspace }}
            --max-retries 2
            --timeout 20
            --accept 200,204,206,429
            --exclude '^http://127\.0\.0\.1(:[0-9]+)?/'
            --exclude '^https://supracraft\.github\.io/'
            --exclude '^file://.*/(Bridge|VanillaCord)(/|$)'
            './README.md'
            './index.html'
            './404.html'
            './accessibility/**/*.html'
            './llms.txt'

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-site-readiness-failure
          path: |
            build/playwright-report
            build/playwright-results
            build/lighthouse
            lychee/out.md
          if-no-files-found: ignore
          retention-days: 3
